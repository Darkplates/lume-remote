name: Windows build and verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enable the Windows Media Foundation feature if absent
        run: |
          $feature = Get-WindowsFeature Server-Media-Foundation
          if (-not $feature.Installed) {
            $result = Install-WindowsFeature Server-Media-Foundation
            if (-not $result.Success -or $result.RestartNeeded -eq 'Yes') { throw 'Media Foundation needs runner preparation.' }
          }
      - name: Verify public source and committed dependency notice provenance
        run: |
          python scripts/check-public-source.py
          if ($LASTEXITCODE -ne 0) { throw 'Public source inspection failed.' }
          python scripts/verify-notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Notice provenance verification failed.' }
      - name: Build pinned native dependencies and the application
        run: .\scripts\build-all.ps1 -Tests
      - name: Verify opt-in benchmark tooling
        run: |
          python scripts/test-benchmark-report.py
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark aggregation tests failed.' }
          .\scripts\test-benchmark-collector.ps1
      - name: Verify without global keyboard or mouse injection
        run: .\scripts\verify.ps1 -Safe
      - name: Verify manual P2P signaling delays with owned loopback proxies
        timeout-minutes: 16
        shell: pwsh
        run: |
          $env:LUME_TEST_DATACHANNEL = Join-Path (Get-Location) 'datachannel.dll'
          & .\tests\LumeTests.exe --p2p-signaling-delay *> verification/ci-p2p-signaling-delay.txt
          if ($LASTEXITCODE -ne 0) { Get-Content verification/ci-p2p-signaling-delay.txt; throw 'Native manual-signaling delay regression failed.' }
      - name: Verify automatic guest reply delivery through the public broker
        # Contacts the third-party PeerJS broker, so an outage there is reported without blocking the build.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          & .\tests\LumeTests.exe --signal *> verification/ci-public-signaling.txt
          $code = $LASTEXITCODE; Get-Content verification/ci-public-signaling.txt
          if ($code -ne 0) { throw 'Public signaling or automatic guest reply delivery failed.' }
      - name: Diagnose the real P2P windows with a reply returned late by hand
        # Loopback only. Prints phase text, never codes. Reported without blocking while being diagnosed.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          & .\tests\LumeTests.exe --p2p-ui *> verification/ci-p2p-ui.txt
          $now = $LASTEXITCODE; Get-Content verification/ci-p2p-ui.txt
          & .\tests\LumeTests.exe --p2p-ui-late 150 *> verification/ci-p2p-ui-late.txt
          $late = $LASTEXITCODE; Get-Content verification/ci-p2p-ui-late.txt
          if ($now -ne 0 -or $late -ne 0) { throw 'The real P2P window flow failed.' }
      - name: Render interface previews in dark and light themes
        run: |
          foreach ($theme in @('dark', 'light')) {
            $env:LUME_THEME = $theme
            & .\tests\LumeTests.exe --ui-preview "verification\ui-$theme"
            if ($LASTEXITCODE -ne 0) { throw "Interface preview ($theme) failed." }
          }
          Remove-Item Env:LUME_THEME
      - name: Idle regression beyond the transport timeout
        run: |
          & .\tests\LumeTests.exe --idle-soak 45
          if ($LASTEXITCODE -ne 0) { throw 'Idle session regression failed.' }
      - name: Verify portable core and Windows interoperability
        # Windows PowerShell 5.1 turns redirected native stderr (including Cargo
        # progress messages) into NativeCommandError under Stop. Keep exit-code checks.
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          $env:RUSTUP_TOOLCHAIN = '1.98.1'
          $env:LUME_TEST_DATACHANNEL = Join-Path (Get-Location) 'datachannel.dll'
          cargo test --manifest-path ports/Cargo.toml -p lume-core -p lume-bridge --locked -j 2 -- --include-ignored *> verification/ci-portable-core.txt
          if ($LASTEXITCODE -ne 0) { Get-Content verification/ci-portable-core.txt; throw 'Portable core tests failed.' }
          cargo build --manifest-path ports/Cargo.toml -p lume-core --examples --locked -j 2
          if ($LASTEXITCODE -ne 0) { throw 'Portable fixtures failed to build.' }
          .\scripts\test-portable.ps1 -SkipBuild -FixtureDirectory "$env:RUNNER_TEMP\lume-interop" *> verification/ci-portable-interop.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows interoperability failed.' }
          .\scripts\test-portable-monitors.ps1 -SkipBuild *> verification/ci-monitors.txt
          if ($LASTEXITCODE -ne 0) { Get-Content verification/ci-monitors.txt; throw 'Portable monitor interoperability failed.' }
          .\scripts\test-portable-annotations.ps1 -Scratch "$env:RUNNER_TEMP\lume-annotations" *> verification/ci-annotations.txt
          if ($LASTEXITCODE -ne 0) { Get-Content verification/ci-annotations.txt; throw 'Portable annotation-gate interoperability failed.' }
          .\scripts\test-portable-access.ps1 -SkipBuild -Pairing -Scratch "$env:RUNNER_TEMP\lume-paired" *> verification/ci-paired.txt
          .\scripts\test-portable-access.ps1 -SkipBuild -Scratch "$env:RUNNER_TEMP\lume-files" *> verification/ci-files.txt
          .\scripts\test-portable-file-host.ps1 -Scratch "$env:RUNNER_TEMP\lume-file-host" *> verification/ci-file-host.txt
          .\scripts\test-portable-permanent.ps1 -Scratch "$env:RUNNER_TEMP\lume-permanent" *> verification/ci-permanent.txt
      - name: Package Windows development checkpoint
        run: .\scripts\package.ps1 -OutputPath "$env:RUNNER_TEMP\LumeRemote-0.12.1-dev-win64.zip"
      - name: Build Android development and isolated-test APKs
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = '1.98.1'
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          if (-not $env:JAVA_HOME -or -not $env:ANDROID_HOME) { throw 'JDK 17 and the Android SDK are required.' }
          .\scripts\test-android-remediation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Android JVM remediation regressions failed.' }
          rustup target add aarch64-linux-android x86_64-linux-android
          if ($LASTEXITCODE -ne 0) { throw 'Android Rust targets are unavailable.' }
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK components could not be installed.' }
          $peer = Join-Path (Get-Location) 'build\peer-source'
          $cmake = Join-Path $peer 'tools\cmake-4.4.3-windows-x86_64\bin\cmake.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe'
          .\scripts\build-android.ps1 -Sdk $env:ANDROID_HOME -CMake $cmake -Ninja $ninja -PeerSource $peer
          if ($LASTEXITCODE -ne 0) { throw 'Android native build failed.' }
          python scripts/collect-portable-notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable notice collection failed.' }
          .\ports\android\gradlew.bat -p ports/android :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
          if ($LASTEXITCODE -ne 0) { throw 'Android APK build or lint failed.' }
          python scripts/verify-android.py ports/android/app/build/outputs/apk/debug/app-debug.apk
          if ($LASTEXITCODE -ne 0) { throw 'Android package verification failed.' }
          python scripts/verify-android-inputs.py ports/android/app/build/outputs/apk/debug/app-debug.apk
          if ($LASTEXITCODE -ne 0) { throw 'Android native input identity verification failed.' }
      - name: Verify archive contents and hashes
        run: .\scripts\verify-package.ps1 -Archive "$env:RUNNER_TEMP\LumeRemote-0.12.1-dev-win64.zip" -ExtractDirectory "$env:RUNNER_TEMP\lume-extracted"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-development-and-test-reports
          path: |
            ${{ runner.temp }}/LumeRemote-0.12.1-dev-win64.zip
            verification/*.txt
            verification/ui-*/*.png
            ports/android/app/build/outputs/apk/debug/*.apk
            ports/android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  android-runtime:
    # Owned virtual device; no physical device, remote invitation or desktop input.
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: windows-development-and-test-reports
          path: ${{ runner.temp }}/android-inputs
      - name: Run Android remediation instrumentation on an isolated emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/lume-remediation-avd
        run: |
          set -eu
          test -n "$ANDROID_HOME" && test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" verification
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;default;x86_64'
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n LumeRemediation -k 'system-images;android-35;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd LumeRemediation -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -feature -Vulkan -memory 2048 -cores 2 -port 5558 > verification/android-emulator.txt 2>&1 &
          emulator_pid=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          trap '"$adb" -s emulator-5558 emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          "$adb" start-server
          booted=false
          for attempt in $(seq 1 180); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat verification/android-emulator.txt; exit 1; fi
            if [ "$("$adb" -s emulator-5558 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" = true
          # The Windows report artifact also contains files from RUNNER_TEMP;
          # its common root can include checkout-directory components.
          find "$RUNNER_TEMP/android-inputs" -type f -path '*/ports/android/app/build/outputs/apk/debug/app-debug.apk' > verification/android-app-path.txt
          find "$RUNNER_TEMP/android-inputs" -type f -path '*/ports/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk' > verification/android-tests-path.txt
          test "$(wc -l < verification/android-app-path.txt)" -eq 1
          test "$(wc -l < verification/android-tests-path.txt)" -eq 1
          app=$(cat verification/android-app-path.txt)
          tests=$(cat verification/android-tests-path.txt)
          test -f "$app" && test -f "$tests"
          sha256sum "$app" "$tests" > verification/android-runtime-inputs.txt
          "$adb" -s emulator-5558 install "$app"
          "$adb" -s emulator-5558 install "$tests"
          "$adb" -s emulator-5558 shell am instrument -w -e remediation_only true com.lume.remote.test/com.lume.remote.ContractInstrumentation > verification/android-runtime.txt
          cat verification/android-runtime.txt
          grep -q 'PASS Android isolated remediation contract' verification/android-runtime.txt
          if grep -E 'FAIL|INSTRUMENTATION_FAILED|Process crashed' verification/android-runtime.txt; then exit 1; fi
          "$adb" -s emulator-5558 logcat -d -t 500 > verification/android-runtime-logcat.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: android-remediation-runtime-reports
          path: verification/android-*.txt
          if-no-files-found: error
          retention-days: 14
  screenshots:
    # Maintainer tool: a push to a non-default branch whose head commit message contains
    # [render-ui] commits the Windows-rendered interface previews to that same branch.
    # Tag pushes never qualify. The previews are committed on top of the exact commit that
    # was rendered; if the branch has moved since, the push is rejected rather than merged.
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[render-ui]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Commit Windows interface previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n windows-development-and-test-reports -D "$RUNNER_TEMP/reports"
          for theme in dark light; do
            source=$(find "$RUNNER_TEMP/reports" -type d -name "ui-$theme" | head -n 1)
            test -n "$source" || { echo "Missing ui-$theme previews"; exit 1; }
            mkdir -p "docs/images/ui/$theme" && cp "$source"/*.png "docs/images/ui/$theme/"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/ui
          if git diff --cached --quiet; then echo "No interface changes."; exit 0; fi
          git commit -m "Update interface previews rendered by Windows CI"
          git push origin "HEAD:$GITHUB_REF"
