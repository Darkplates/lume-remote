plugins { id 'com.android.application' }
android {
    // The Java-only UI does not need the automatically added Kotlin runtime.
    enableKotlin = false
    namespace 'com.lume.remote'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lume.remote'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '0.12.0-dev'
        testInstrumentationRunner 'com.lume.remote.ContractInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
    sourceSets { main { assets.srcDir rootProject.file('../../third-party') } }
    buildTypes { release { minifyEnabled false } }
}
